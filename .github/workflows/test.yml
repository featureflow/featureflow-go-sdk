name: Test

# There is no publish step for a Go module — pushing a semver tag IS the
# release (the Go proxy serves it straight from GitHub). This workflow gates
# pushes, PRs, and tags with the same suite that runs locally.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
